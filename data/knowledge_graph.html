        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 2, "color": {"background": "#6c5ce7", "border": "#ffffff", "highlight": {"background": "#ffffff", "border": "#6c5ce7"}, "hover": {"background": "#ffffff", "border": "#6c5ce7"}}, "font": {"color": "#ffffff"}, "id": "Adhithya.pdf", "label": "Adhithya.pdf", "shadow": true, "shape": "dot", "size": 35, "title": "\u003cdiv style=\u0027font-family:sans-serif;padding:6px\u0027\u003e\u003cb\u003e\ud83d\udcc4 Adhithya.pdf\u003c/b\u003e\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eType: paper\u003c/span\u003e\u003c/div\u003e"}, {"borderWidth": 2, "color": {"background": "#00b894", "border": "#ffffff", "highlight": {"background": "#ffffff", "border": "#00b894"}, "hover": {"background": "#ffffff", "border": "#00b894"}}, "font": {"color": "#ffffff"}, "id": "model::LSTM", "label": "LSTM", "shadow": true, "shape": "dot", "size": 20, "title": "\u003cdiv style=\u0027font-family:sans-serif;padding:6px\u0027\u003e\u003cb\u003e\ud83e\udd16 LSTM\u003c/b\u003e\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eType: model\u003c/span\u003e\u003c/div\u003e"}, {"borderWidth": 2, "color": {"background": "#00b894", "border": "#ffffff", "highlight": {"background": "#ffffff", "border": "#00b894"}, "hover": {"background": "#ffffff", "border": "#00b894"}}, "font": {"color": "#ffffff"}, "id": "model::LLaMA 3", "label": "LLaMA 3", "shadow": true, "shape": "dot", "size": 20, "title": "\u003cdiv style=\u0027font-family:sans-serif;padding:6px\u0027\u003e\u003cb\u003e\ud83e\udd16 LLaMA 3\u003c/b\u003e\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eType: model\u003c/span\u003e\u003c/div\u003e"}, {"borderWidth": 2, "color": {"background": "#e17055", "border": "#ffffff", "highlight": {"background": "#ffffff", "border": "#e17055"}, "hover": {"background": "#ffffff", "border": "#e17055"}}, "font": {"color": "#ffffff"}, "id": "metric::accuracy", "label": "accuracy", "shadow": true, "shape": "dot", "size": 20, "title": "\                   edges = new vis.DataSet([{"color": {"color": "#00b894", "opacity": 0.7}, "from": "Adhithya.pdf", "smooth": {"type": "dynamic"}, "title": "model", "to": "model::LSTM", "width": 1.5}, {"color": {"color": "#00b894", "opacity": 0.7}, "from": "Adhithya.pdf", "smooth": {"type": "dynamic"}, "title": "model", "to": "model::LLaMA 3", "width": 1.5}, {"color": {"color": "#e17055", "opacity": 0.7}, "from": "Adhithya.pdf", "smooth": {"type": "dynamic"}, "title": "metric", "to": "metric::accuracy", "width": 1.5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -120, "centralGravity": 0.005, "springLength": 220, "springConstant": 0.08, "damping": 0.6, "avoidOverlap": 1.0}, "stabilization": {"enabled": true, "iterations": 300, "updateInterval": 25}, "minVelocity": 0.75}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
